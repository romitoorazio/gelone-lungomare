name: Correggi qualità dati prenotazioni concluse

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-admin-quality:
    if: ${{ !contains(github.event.head_commit.message, 'fix: archivia automaticamente soggiorni conclusi') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Correggi controlli qualità dati
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/Admin.jsx')
          text = path.read_text(encoding='utf-8')
          original = text

          old_privacy = '''    if (
      (source === "direct_site" || ["pending_direct", "confirmed_direct"].includes(status)) &&
      !(booking.privacyAccepted && booking.termsAccepted)
    ) {
      issues.push("Consenso privacy/termini non registrato");
    }
'''
          new_privacy = '''    if (
      source === "direct_site" &&
      !(booking.privacyAccepted && booking.termsAccepted)
    ) {
      issues.push("Consenso privacy/termini non registrato");
    }
'''

          old_quality = '''  const qualityStats = useMemo(() => {
    const rows = bookings
      .filter((booking) => booking.status !== "blocked" && booking.status !== "cancelled")
      .map((booking) => ({
'''
          new_quality = '''  const qualityStats = useMemo(() => {
    const today = getToday();
    const rows = bookings
      .filter((booking) => booking.status !== "blocked" && booking.status !== "cancelled")
      .filter((booking) => {
        const checkOut = String(booking.checkOut || "");
        return !checkOut || checkOut >= today;
      })
      .map((booking) => ({
'''

          if old_privacy not in text:
              raise SystemExit('Blocco privacy atteso non trovato: nessuna modifica eseguita.')
          if old_quality not in text:
              raise SystemExit('Blocco qualità dati atteso non trovato: nessuna modifica eseguita.')

          text = text.replace(old_privacy, new_privacy, 1)
          text = text.replace(old_quality, new_quality, 1)

          if text == original:
              raise SystemExit('Nessuna modifica necessaria.')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit correzione
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nessuna modifica da pubblicare."
            exit 0
          fi
          git config user.name "Gelone PMS Bot"
          git config user.email "romitoorazio@gmail.com"
          git add src/Admin.jsx
          git commit -m "fix: archivia automaticamente soggiorni conclusi"
          git push
