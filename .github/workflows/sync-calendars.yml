name: Sync calendari Gelone

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions usa UTC. La sincronizzazione non dipende dall'ora locale.
    - cron: "*/15 * * * *"

concurrency:
  group: gelone-calendar-sync
  cancel-in-progress: false

jobs:
  sync-calendars:
    name: Sincronizza Booking e Airbnb
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Chiama endpoint sincronizzazione calendari
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET}" ]; then
            echo "ERRORE: secret GitHub CRON_SECRET mancante."
            exit 1
          fi

          response="$(curl --retry 2 --retry-delay 5 --connect-timeout 15 --max-time 120 -sS -w '\nHTTP_STATUS:%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: github-actions-calendar-sync" \
            "https://www.gelone.it/api/cron-sync-calendars")"

          echo "$response"

          status="$(echo "$response" | sed -n 's/^HTTP_STATUS://p')"

          if [ -z "$status" ] || [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "ERRORE: sincronizzazione fallita con HTTP ${status:-sconosciuto}"
            exit 1
          fi

          echo "Sincronizzazione completata con HTTP $status"
